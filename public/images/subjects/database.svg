<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFEFF" />
      <stop offset="100%" stop-color="#CFFAFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0891B2" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#A5F3FC" stroke-width="2" stroke-dasharray="6 6"/>
  <g filter="url(#glow)" fill="none" stroke-width="10">
    <!-- Cylinder Top -->
    <path d="M120 140 C120 110, 280 110, 280 140 C280 170, 120 170, 120 140 Z" fill="#0891B2" stroke="#0891B2"/>
    <ellipse cx="200" cy="140" rx="80" ry="25" fill="#22D3EE"/>
    
    <!-- Cylinder Middle -->
    <path d="M120 140 L120 200 C120 230, 280 230, 280 200 L280 140" stroke="#0891B2" fill="#FFFFFF"/>
    <path d="M120 200 C120 230, 280 230, 280 200" stroke="#0891B2"/>
    
    <!-- Cylinder Bottom -->
    <path d="M120 200 L120 260 C120 290, 280 290, 280 260 L280 200" stroke="#0891B2" fill="#FFFFFF"/>
    <path d="M120 260 C120 290, 280 290, 280 260" stroke="#0891B2"/>
  </g>
</svg>
