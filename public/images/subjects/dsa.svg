<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="135" fill="none" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="5 5"/>
  <g filter="url(#glow)">
    <!-- Tree Lines -->
    <path d="M200 120 L130 200 M200 120 L270 200 M130 200 L100 280 M130 200 L160 280 M270 200 L240 280 M270 200 L300 280" stroke="#6366F1" stroke-width="6" stroke-linecap="round"/>
    <!-- Nodes -->
    <circle cx="200" cy="120" r="24" fill="#4F46E5"/>
    <circle cx="130" cy="200" r="20" fill="#818CF8"/>
    <circle cx="270" cy="200" r="20" fill="#818CF8"/>
    <circle cx="100" cy="280" r="16" fill="#FFFFFF" stroke="#6366F1" stroke-width="4"/>
    <circle cx="160" cy="280" r="16" fill="#FFFFFF" stroke="#6366F1" stroke-width="4"/>
    <circle cx="240" cy="280" r="16" fill="#FFFFFF" stroke="#6366F1" stroke-width="4"/>
    <circle cx="300" cy="280" r="16" fill="#FFFFFF" stroke="#6366F1" stroke-width="4"/>
  </g>
</svg>
