<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#DB2777" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="135" fill="none" stroke="#FBCFE8" stroke-width="2" stroke-dasharray="6 6"/>
  <g filter="url(#glow)">
    <rect x="130" y="80" width="140" height="240" rx="28" fill="#FFFFFF" stroke="#FCE7F3" stroke-width="3"/>
    <rect x="145" y="105" width="110" height="180" rx="12" fill="#DB2777"/>
    <!-- App UI Mock -->
    <circle cx="200" cy="140" r="20" fill="#FFFFFF" opacity="0.9"/>
    <rect x="165" y="175" width="70" height="10" rx="5" fill="#FFFFFF" opacity="0.8"/>
    <rect x="155" y="195" width="90" height="8" rx="4" fill="#FFFFFF" opacity="0.5"/>
    <rect x="155" y="210" width="90" height="8" rx="4" fill="#FFFFFF" opacity="0.5"/>
    <!-- Home Indicator Bar -->
    <rect x="175" y="300" width="50" height="4" rx="2" fill="#9CA3AF"/>
  </g>
</svg>
