<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#16A34A" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="135" fill="none" stroke="#BBF7D0" stroke-width="2" stroke-dasharray="8 6"/>
  <g filter="url(#glow)">
    <!-- Interconnecting Mesh Lines -->
    <path d="M200 110 L110 180 M200 110 L290 180 M110 180 L140 280 M290 180 L260 280 M140 280 L260 280 M110 180 L290 180" stroke="#16A34A" stroke-width="5" opacity="0.6"/>
    <!-- Globe/Hub Center Circle -->
    <circle cx="200" cy="200" r="80" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="4"/>
    <circle cx="200" cy="200" r="50" fill="#16A34A"/>
    <!-- Outer Connected Satellite Nodes -->
    <circle cx="200" cy="110" r="16" fill="#22C55E"/>
    <circle cx="110" cy="180" r="16" fill="#22C55E"/>
    <circle cx="290" cy="180" r="16" fill="#22C55E"/>
    <circle cx="140" cy="280" r="16" fill="#22C55E"/>
    <circle cx="260" cy="280" r="16" fill="#22C55E"/>
  </g>
</svg>
